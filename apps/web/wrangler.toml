name = "wellbusiness-web"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
account_id = "84ffa5d2db10e557297317693d5ae3bf"
workers_dev = true
# Fase 4: el sitio pasa de "solo assets estáticos" a un Worker real (el
# adaptador de Astro) porque la mayoría de páginas ahora lee de D1.
main = "@astrojs/cloudflare/entrypoints/server"

[[routes]]
pattern = "idrocomsolutions.com"
custom_domain = true

[[routes]]
pattern = "www.idrocomsolutions.com"
custom_domain = true

[assets]
directory = "./dist"
# `404.astro` es ahora `prerender = false` (ya no genera un `404.html`
# estático — Astro no permite un rewrite hacia una ruta prerenderizada
# desde `/catalogo/[slug]`, confirmado en vivo). Un 404 real ahora lo
# resuelve siempre el Worker (`main`), nunca el fallback estático de
# assets, así que `not_found_handling` no aplica.
binding = "ASSETS"

# Misma base D1 y el mismo namespace KV que wellbusiness-portal (ver
# clientes/wellbusiness/wrangler.portal.jsonc, en la raíz del repo). El sitio
# lee colecciones/bloques publicados y fotos; desde la Fase 5 también escribe
# en `envios_formulario` (POST /api/formularios/<tipo>), nunca en nada más.
[[d1_databases]]
binding = "DB"
database_name = "wellbusiness-db"
database_id = "2afc8400-5ed4-423d-bf72-27f7cee8ece0"

[[kv_namespaces]]
binding = "MEDIOS"
id = "76a57ddc1568418ebaeb3c2d6bd8e8d2"
